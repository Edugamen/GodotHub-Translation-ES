name: Bug Report
description: File a bug report.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: os-info
    attributes:
      label: OS and Hardware
      description: Can you tell us which OS and Hardware are you on?
      placeholder: I use Arch BTW...
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of the software are you using?
      options:
        - 0.5.x
        - 1.0.0
        - 1.1.0
        - 1.1.5
        - 1.2.0
      default: 4
    validations:
      required: true
  - type: checkboxes
    id: usage-method
    attributes:
      label: Your method of Using
      description: Which version are you using for this. You can select multiple.
      options:
        - label: "[Windows] Executable (xx.exe)"
        - label: "[Windows] NSIS Setup (xx-setup.exe)"
        - label: "[Windows] MSI Setup (xx.msi)"
        - label: "[Linux] AppImage (xx.AppImage)"
        - label: "[Linux] Debian (xx.deb)"
        - label: "[Linux] RPM (xx.rpm)"
        - label: "[Mac] DMG (xx.dmg)"
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
