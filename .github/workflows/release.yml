# Builds GodotHub when a tag like v1.0.0 is pushed,
# signs the updater artifacts, auto-generates latest.json,
# and publishes a GitHub Release with installers and updater files.

name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          - os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run tsc --noEmit

      - name: Generate release notes from changelog
        id: release-notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          BODY=$(node - <<'EOF'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const entries = JSON.parse(fs.readFileSync('src-tauri/changelog.json', 'utf8'));
          const entry = entries.find((e) => (e.version || '').trim().split(' ')[0] === tag)
            || entries.find((e) => (e.version || '').trim().split(' ')[0].startsWith(tag));
          const HEADERS = { add: '🚀 New', fix: '🐛 Fixes', improve: '✨ Improvements' };
          if (!entry) {
            console.log('See the assets below for the installer and updater files for your platform.');
            process.exit(0);
          }
          const sections = ['add', 'fix', 'improve']
            .map((k) => ({ k, items: (entry.notes || []).filter((n) => n.category === k).map((n) => n.text) }))
            .filter((s) => s.items.length)
            .map((s) => `## ${HEADERS[s.k]}\n\n` + s.items.map((t) => `- ${t}`).join('\n'))
            .join('\n\n');
          const known = (entry.known_issues || []).filter(Boolean);
          const knownSection = known.length
            ? `\n\n## ⚠️ Known Issues\n\n` + known.map((t) => `- ${t}`).join('\n')
            : '';
          console.log(`## What's new in ${entry.version}\n\n${sections}${knownSection}`);
          EOF
          )
          {
            echo "body<<GH_RELEASE_NOTES"
            echo "$BODY"
            echo "GH_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'GodotHub ${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload standalone executable (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/release/GodotHub.exe" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rewrite-updater-urls:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Point latest.json at the release download URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/$REPO/releases" \
            --jq "map(select(.tag_name == \"$TAG\")) | .[0].id // empty")
          if [ -z "$release_id" ]; then
            echo "no release found for tag $TAG" >&2
            exit 1
          fi
          gh api --paginate "repos/$REPO/releases/$release_id/assets" > assets.json
          asset_id=$(node -e "
            const a = require('./assets.json').find((a) => a.name === 'latest.json');
            if (!a) { console.error('latest.json is not attached to the release'); process.exit(1); }
            console.log(a.id);
          ")
          gh api -H "Accept: application/octet-stream" \
            "repos/$REPO/releases/assets/$asset_id" > latest.json
          node - <<'EOF'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const downloadUrls = new Map(
            JSON.parse(fs.readFileSync('assets.json', 'utf8')).map((a) => [
              a.url,
              a.browser_download_url,
            ]),
          );
          let rewritten = 0;
          let alreadyDirect = 0;
          for (const [platform, data] of Object.entries(manifest.platforms ?? {})) {
            if (!data.url.startsWith('https://api.github.com/')) {
              alreadyDirect++;
              continue;
            }
            const downloadUrl = downloadUrls.get(data.url);
            if (!downloadUrl) {
              throw new Error(`no release asset matches ${platform} url ${data.url}`);
            }
            data.url = downloadUrl;
            rewritten++;
          }
          if (rewritten + alreadyDirect === 0) {
            throw new Error('latest.json has no platform entries');
          }
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          console.log(`rewrote ${rewritten} urls, ${alreadyDirect} already direct`);
          EOF
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
